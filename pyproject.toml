[project]
name = "sozvon"
version = "0.2.1"
description = "Локальная расшифровка созвонов и отчёты"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic>=2.7",
    "platformdirs>=4.2",
    "keyring>=25",
    "tomli-w>=1.1",
    "av>=12",
    "numpy>=1.26",
    "sounddevice>=0.5",
    "pyaudiowpatch>=0.2.12.8; sys_platform == 'win32'",
    "faster-whisper>=1.0",
    "python-docx>=1.1",
    "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.5",
    "playwright>=1.45",
    "pypdf>=5,<7",
    "pypdfium2>=4,<6",
]
build = ["pyinstaller>=6"]

[project.scripts]
sozvon = "sozvon.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sozvon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["hardware: требует настоящего оборудования", "live: требует модели или API"]

[tool.ruff]
line-length = 100
